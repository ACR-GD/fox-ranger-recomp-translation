name: Build & Release Fox Ranger

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: Darwin
            artifact_ext: zip
          - os: ubuntu-latest
            platform: Linux
            artifact_ext: tar.gz
          - os: windows-latest
            platform: Windows
            artifact_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SDL2
        uses: libsdl-org/setup-sdl@v1
        with:
          version: 2.30.10

      - name: Configure CMake (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build Fox Ranger
        run: cmake --build build --config Release --parallel

      - name: Run Build Tests (Non-asset sanity checks)
        run: ctest --test-dir build -C Release --output-on-failure -E "diff_|audio_sfx_opl|boot_title_stage1" || true

      - name: Package with CPack (macOS)
        if: runner.os == 'macOS'
        run: |
          ./packaging/bundle_macos.sh build/FoxRanger.app "${SDL2_ROOT:-}"
          cd build
          cpack -C Release -G ZIP
          shasum -a 256 FoxRanger-*.zip > FoxRanger-checksums-sha256.txt

      - name: Package with CPack (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          cpack -C Release -G "TGZ;ZIP"
          sha256sum FoxRanger-*.tar.gz FoxRanger-*.zip > FoxRanger-checksums-sha256.txt

      - name: Package with CPack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Copy SDL2.dll into build directory so CMake install() packages it
          $sdlDll = Get-ChildItem -Path "${env:SDL2_DIR}" -Filter "SDL2.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sdlDll) {
            Copy-Item $sdlDll.FullName -Destination "build\Release\SDL2.dll" -ErrorAction SilentlyContinue
            Copy-Item $sdlDll.FullName -Destination "build\SDL2.dll" -ErrorAction SilentlyContinue
          }
          cd build
          cpack -C Release -G ZIP
          Get-FileHash -Algorithm SHA256 FoxRanger-*.zip | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding ascii FoxRanger-checksums-sha256.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoxRanger-${{ matrix.platform }}
          path: |
            build/FoxRanger-*.zip
            build/FoxRanger-*.tar.gz
            build/FoxRanger-checksums-sha256.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate Release Assets
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*checksums*.txt" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
